<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Trackpile</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Lista personal de proyectos: estado, stack y donde esta publicado cada uno." />
    <meta name="color-scheme" content="light dark" />
    <!-- Los tonos reales de la app: antes iban dos colores que ya no existian. -->
    <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />

    <!-- Instalable en el telefono -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trackpile" />

    <!-- El .ico se declara aunque el navegador lo pida solo: asi queda claro
         cual es y no se cuela uno viejo que ande por la carpeta.
         El ?v= salta la copia que Cloudflare guarda 4 horas; subelo cuando
         cambie el icono, o durante ese rato se sigue viendo el anterior. -->
    <link rel="icon" href="favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <!-- iOS ignora el manifiesto para el icono de inicio: lo saca de aqui. -->
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preload" href="fonts/PlusJakartaSans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/SpaceGrotesk.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
